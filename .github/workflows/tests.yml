name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -m 'not integration' --junitxml=reports/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/ci-tests.xml
